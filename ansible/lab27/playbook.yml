---
- name: Configure Nginx Web Server
  hosts: web
  connection: local
  become: yes

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Start Nginx
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Copy Custom Web Page
      copy:
        src: index.html
        dest: /var/www/html/index.html